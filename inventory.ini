# Connection settings for the source servers listed in the stream CSVs.
# Do NOT set ansible_connection here - the playbook forces WinRM first, then SSH.

[all:vars]
# credentials used for both WinRM and SSH attempts
ansible_user=DOMAIN\svc-connectivity
ansible_password=CHANGE_ME

# WinRM (Windows sources)
ansible_port=5985
ansible_winrm_transport=ntlm
ansible_winrm_server_cert_validation=ignore

# Per-host overrides are optional. Example: a source whose DNS name does not
# resolve from the control node, or with different credentials:
#
# [overrides]
# j-msg-ext01 ansible_host=10.20.30.41 ansible_user=OTHER\svc ansible_password=CHANGE_ME
